<html>
<head>
  <title>REGISTER FORM</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body class="background">

  <div class="form-container">
    <h1>REYON X LIVE</h1>
    <p class="subtitle">follow the rule</p>
    
    <div class="input-group">
      <label>1. Discord Name</label>
      <input type="text" class="double-underline">
    </div>
    
    <div class="input-group">
      <label>2. Player Uid</label>
      <input type="text" class="double-underline">
    </div>
    
    <div class="input-group">
      <label>3. Player Game name</label>
      <input type="text" class="double-underline">
    </div>
    
    <!-- Payment Screenshot Section -->
    <div class="input-group">
      <label>4. Payment screenshot</label>
      <div class="upload-box">
        <button class="upload-btn">Upload</button>
        <p class="file-info">* Maximum allowed file size is 50MB.</p>
        <p class="required">Required</p>
      </div>
    </div>
    
    <!-- QR Code Section -->
    <div class="input-group">
      <label>5. Qr Code</label>
      <div class="qr-section">
        <p class="qr-title">paytm UPI</p>
        <img src="qr.png" alt="PayTM QR Code"class="image">
        
        <p class="qr-address">gaurav6027@paytm</p>
      </div>
    </div>
    
    <!-- Form Actions -->
    <div class="form-actions">
      <button class="clear-btn">Clear form</button>
    </div>
  </div>





   

</body>
</html>
